name: Build

on:
  push:
    branches: [main]
  pull_request:

# A run is only useful if it finishes; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung test host otherwise holds a runner for six hours. This is a deadlock
    # guard and not a performance budget, so it is generous on purpose: the suite
    # takes well under a minute and the build a few more.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon, so this is also the only job that runs the
        # suite on arm64. No macOS workload or SDK extra is needed and none is
        # installed on purpose: Altim.Platform.MacOS is a plain net10.0 assembly that
        # reaches NSStatusItem, UNUserNotificationCenter and SMAppService through
        # objc_msgSend rather than through the macOS reference assemblies, which is
        # what keeps the solution building on a machine that has no Mac SDK at all.
        # See the comment at the top of Altim.Platform.MacOS.csproj.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Altim.sln

      # Warnings are errors, so a clean build is part of the contract.
      # The Windows platform project multi-targets a Windows TFM; its reference
      # assemblies come from NuGet, so this builds on Linux and macOS too.
      - name: Build
        run: dotnet build Altim.sln -c Release --no-restore

      # Headless Avalonia tests need no display server on Linux with Avalonia 12,
      # and need no window server on macOS for the same reason: the session is
      # headless and drawing goes through Skia in software.
      #
      # Do not add --nologo: these projects run on Microsoft.Testing.Platform,
      # which rejects VSTest flags and would print help instead of running.
      #
      # The number of skipped tests is not the same on the three platforms and a
      # difference is not a fault. Every skip is a test of behaviour that exists on
      # one operating system only, so each platform skips the ones not about it.
      # Measured on Windows on 2026-09-18 and counted from the source for the other
      # two, the skips are:
      #
      #   windows  3  two UnixFact command-resolution tests, and MacOSNativeStackTests
      #   macOS    7  two WindowsFact, four Windows-only process fixtures, and the
      #               off-macOS half of ForeignPlatformStackTests
      #   Linux    9  the macOS list minus its one macOS skip, plus the two off-Linux
      #               halves of ForeignPlatformStackTests and MacOSNativeStackTests
      #
      # Those totals go stale as tests are added; the rule behind them does not.
      # If a count moves, read WHICH test moved before assuming the platform did.
      - name: Test
        run: dotnet test Altim.sln -c Release --no-build

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: ignore

  # The macOS publish, kept out of the matrix above so that a compile-and-test
  # answer still arrives quickly. Building on macOS and shipping on macOS are
  # different claims and the second one has never been made.
  #
  # Read this before trusting a green tick here. This job failed every one of the
  # first eleven times it ran, all of them at the codesign bundle seal, so no .app,
  # no DMG and no artefact had ever existed. It is green now because the ad-hoc
  # seal was made non-fatal and because --allow-unsealed below tells
  # verify-bundle.sh to report an unsealed bundle rather than fail on it. Both of
  # those are deliberate and temporary. packaging/README.md, "The bundle seal", is
  # the whole story.
  #
  # What this proves: that a self-contained single-file publish assembles into a
  # bundle, that the Info.plist substitution happened, that the icon converts, that
  # the menu bar assets reach a place the app looks in, and that a DMG mounts.
  #
  # What it cannot prove: that the application runs. There is no Apple Developer
  # account, so nothing here is signed with a real identity or notarised, and a
  # runner cannot launch a menu bar app and look at it. The artefact is uploaded so
  # that somebody with a Mac can do the part a runner cannot.
  #
  # One job per architecture. There is no universal bundle: merging two single-file
  # hosts with lipo is an unobserved behaviour, and this is not the job to find out
  # in. See packaging/README.md, "Why there is no universal build".
  macos-bundle:
    name: macOS app bundle (${{ matrix.arch }})
    runs-on: macos-latest
    # One self-contained publish, an inside-out codesign pass and a DMG.
    timeout-minutes: 45
    strategy:
      # An arm64 bundle is worth having even on a day the x64 one breaks.
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Invoked through bash rather than as ./packaging/... so that a missing
      # executable bit in the index cannot turn into a "Permission denied".
      #
      # A prerelease version on purpose: CFBundleShortVersionString takes at most
      # three integers, so the script has to strip the "-ci" suffix, and the check
      # below asserts that it did.
      - name: Build Altim.app and the DMG
        run: bash packaging/macos/build-macos.sh --version 0.0.0-ci --arch ${{ matrix.arch }}

      # Assembling without an error is not the same as having an application.
      # verify-bundle.sh reads the result back; it is a script rather than steps
      # here so the same checks can be run by hand against the uploaded artefact.
      #
      # --allow-unsealed is the temporary part, and it is only on this workflow.
      # It downgrades exactly two checks to warnings: that the bundle carries a
      # code signature seal, and that Contents/MacOS holds nothing but Mach-O.
      # Everything else, including that the main executable carries a signature of
      # its own, is still a failure. release.yml does NOT pass it, so a release
      # cannot ship an unsealed bundle.
      #
      # REMOVE IT once a run of this job reports "sealed and valid, ad-hoc". At
      # that point the single-file publish has done its job and the guard should be
      # back on. The step summary build-macos.sh writes says which state it is in.
      - name: Check the bundle
        run: >
          bash packaging/macos/verify-bundle.sh
          dist/.macos-stage/${{ matrix.arch }}/Altim.app
          0.0.0 ${{ matrix.arch }} --allow-unsealed

      # The DMG is the artefact a user would download, so mounting it is the last
      # thing between "a file was produced" and "the file is a disk image with an
      # application on it".
      - name: Mount the DMG and look inside
        run: |
          set -euo pipefail
          dmg="$(find dist/macos -name '*.dmg' -print -quit)"
          [ -n "$dmg" ] || { echo "no DMG was produced" >&2; exit 1; }
          hdiutil verify "$dmg"
          mountpoint="$RUNNER_TEMP/altim-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" || true' EXIT
          ls -la "$mountpoint"
          [ -d "$mountpoint/Altim.app" ] || { echo "the DMG has no Altim.app in it" >&2; exit 1; }
          [ -L "$mountpoint/Applications" ] || { echo "the DMG has no /Applications symlink to drag onto" >&2; exit 1; }

      # always(), because the point of this job is to put a bundle where somebody
      # can look at it. A step above failing is the case where that matters most,
      # and a red job with nothing attached is what the last eleven runs were.
      # if-no-files-found is warn rather than error for the same reason: a build
      # that produced nothing has already reported why, and a second error on top
      # only buries it. The mount step above is what asserts a DMG exists.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-unsigned-bundle-${{ matrix.arch }}
          path: dist/macos/**
          if-no-files-found: warn
          retention-days: 14
